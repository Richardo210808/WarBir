  <section id="reservasi" class="py-16 bg-white border-y border-slate-200">
    <div class="max-w-4xl mx-auto px-4 sm:px-6">
      <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 rounded-3xl p-6 sm:p-10 shadow-sm">
        <div class="text-center max-w-xl mx-auto mb-8">
          <h3 class="font-serif-display text-2xl sm:text-3xl font-bold text-slate-900">Reservasi Meja / Pesanan Langsung</h3>
          <p class="text-slate-600 text-sm mt-2">Isi formulir di bawah ini, data akan langsung diteruskan ke WhatsApp resmi Warung Biru (089673320443) untuk konfirmasi kilat.</p>
        </div>

        <form onsubmit="handleQuickReservation(event)" class="space-y-4">
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
              <input id="res-name" type="text" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Jumlah Orang / Porsi</label>
              <input id="res-guests" type="number" min="1" max="100" value="1" required class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal Rencana</label>
              <input id="res-date" type="date" required class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Jam Kedatangan</label>
              <input id="res-time" type="time" value="12:00" required class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Catatan Tambahan / Menu yang Ingin Disiapkan</label>
            <textarea id="res-notes" rows="3" placeholder="Contoh: Tolong siapkan 2 porsi Ayam Goreng Lengkuas dan Es Teh Manis Jumbo ya..." class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
          </div>
          <button type="submit" class="w-full py-3.5 px-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
            Kirimkan Permintaan Reservasi ke WhatsApp
          </button>
        </form>
      </div>
    </div>
  </section>
